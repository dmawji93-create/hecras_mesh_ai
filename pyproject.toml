[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hecras_mesh_ai"
version = "0.0.1"
description = "AI-assisted HEC-RAS 2D mesh generation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Dante Mawji" }]
license = { text = "Proprietary" }

# Full ML / geospatial stack per ADR 005. Declared here so the
# dependency surface is visible in one place. Installation of the
# heavy half (torch, lightning, etc.) is deferred to Week 1 Task 2
# via `uv sync --extra ml`; only `dev` is wired up at scaffold time.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
ml = [
    # Core ML
    "torch>=2.2",
    "lightning>=2.2",
    "segmentation-models-pytorch>=0.3",
    "torchgeo>=0.5",
    # Geospatial I/O
    "rasterio>=1.3",
    "geopandas>=0.14",
    "xarray>=2024.1",
    "rioxarray>=0.15",
    "shapely>=2.0",
    # Image processing
    "scikit-image>=0.22",
    # HEC-RAS I/O
    "rashdf>=0.5",
    "h5py>=3.10",
    # Experiment tracking
    "wandb>=0.16",
    # Notebook support
    "jupyter>=1.0",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hecras_mesh_ai"]

# CUDA torch / torchvision via the PyTorch CUDA 12.8 index.
# See docs/decisions/010-cuda-platform.md for rationale and tradeoffs.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]
# Don't complain about unused imports in __init__.py
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
